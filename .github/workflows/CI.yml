name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Sync package.json version
        # Same single source as the release workflow: VERSION, minus the v.
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          jq --arg v "${VERSION#v}" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          grep '"version"' package.json

      - name: Install deps
        run: bun install

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Smoke build (linux-x64)
        run: bun run build:linux-x64

      - name: Verify binary
        run: |
          chmod +x dist/opencode-terminal-cli-linux-x64
          ./dist/opencode-terminal-cli-linux-x64 --help
