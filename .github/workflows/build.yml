name: Build and Release

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 0.2.1). Empty = read the VERSION file.'
        required: false
        default: ''
      publish:
        description: 'Create the tag and release. Uncheck to build the binaries only.'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          INPUT_VERSION='${{ github.event.inputs.version }}'

          if [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi

          if [[ -z "${VERSION}" ]]; then
            echo "::error::VERSION is empty."
            exit 1
          fi

          # The file holds the bare number; tags are v-prefixed.
          [[ "${VERSION}" == v* ]] || VERSION="v${VERSION}"

          # Git refs allow a narrow character set; sanitise rather than fail.
          VERSION="$(printf '%s' "${VERSION}" | tr -c 'A-Za-z0-9._-' '-')"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            PUBLISH='${{ github.event.inputs.publish }}'
          else
            # The only other trigger is a push that changed VERSION.
            PUBLISH=true
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION} publish=${PUBLISH}"

  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: determine-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            artifact: opencode-terminal-cli-linux-x64
          - target: linux-arm64
            artifact: opencode-terminal-cli-linux-arm64
          - target: darwin-x64
            artifact: opencode-terminal-cli-darwin-x64
          - target: darwin-arm64
            artifact: opencode-terminal-cli-darwin-arm64
          - target: windows-x64
            artifact: opencode-terminal-cli-windows-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build ${{ matrix.target }}
        run: bun run build:${{ matrix.target }}

      - name: Smoke test
        # Only the native target can run on the runner; the others are proven by
        # the compile step alone.
        if: matrix.target == 'linux-x64'
        run: |
          chmod +x dist/${{ matrix.artifact }}
          ./dist/${{ matrix.artifact }} --help
          ./dist/${{ matrix.artifact }} --config

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Tag and release
    needs: [determine-version, build]
    runs-on: ubuntu-latest
    if: needs.determine-version.outputs.publish == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          ls -la
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Creates the tag at this commit if it does not exist yet.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-version.outputs.version }}
          name: ${{ needs.determine-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/opencode-terminal-cli-linux-x64
            dist/opencode-terminal-cli-linux-arm64
            dist/opencode-terminal-cli-darwin-x64
            dist/opencode-terminal-cli-darwin-arm64
            dist/opencode-terminal-cli-windows-x64.exe
            dist/SHA256SUMS

      - name: Summary
        run: |
          V="${{ needs.determine-version.outputs.version }}"
          echo "**Tag:** \`${V}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Assets:** five binaries plus SHA256SUMS" >> $GITHUB_STEP_SUMMARY
